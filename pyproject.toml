[build-system]
requires = ["setuptools>=69", "wheel", "cffi>=1.17,<3", "unicorn==2.1.4"]
build-backend = "setuptools.build_meta"

[project]
name = "rp2040-sim"
version = "0.1.0"
description = "An inspectable RP2040 firmware simulator with a C engine and Python desktop UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cffi>=1.17,<3", "unicorn==2.1.4", "pyelftools>=0.31,<1"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8,<7"]
dev = ["pytest>=8,<10", "cmake>=3.25,<5"]

[project.scripts]
rp2040-sim = "rp2040_sim.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
rp2040_sim = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

